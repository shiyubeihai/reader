  $('#btnShelfMgr').addEventListener('click', function(){
    ensureShelves().then(function(){ renderMgr(); openSheet('#mgr'); });
  });
  $('#mgrClose').addEventListener('click', function(){ closeSheet('#mgr'); });
  $('#btnNewShelf').addEventListener('click', newShelf);
  $('#btnExportShelf').addEventListener('click', function(){ exportShelfZip(SHELF); });
  $('#chooserClose').addEventListener('click', function(){ closeSheet('#chooser'); });

  window.addEventListener('error', function(e){
    if (e && e.message) toast('出错：' + e.message, 4000);
  });
  window.addEventListener('unhandledrejection', function(e){
    var m = e && e.reason && (e.reason.message || e.reason);
    toast('出错：' + (m || '未知错误'), 4000);
  });

  $('#tabToc').addEventListener('click', function(){ showTab('toc'); });
  $('#tabBm').addEventListener('click', function(){ showTab('bm'); buildBmList(); });
  $('#tabSearch').addEventListener('click', function(){ showTab('search'); });
  $('#searchGo').addEventListener('click', doSearch);
  $('#searchInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ doSearch(); e.preventDefault(); }
    e.stopPropagation();
  });

  $('#btnPrev').addEventListener('click', prevPage);
  $('#btnNext').addEventListener('click', nextPage);
  $('#slider').addEventListener('input', function(e){
    gotoPage(parseInt(e.target.value, 10) || 0, false);
  });

  // 排版开关
  $('#btnDir').addEventListener('click', function(){
    S.vertical = !S.vertical;
    S.userDirSet = true;
    saveCfg(); syncControls();
    if (!R.chapters.length) return;
    var ratio = R.page / Math.max(1, PAGES);
    buildChapter();
    measureAndLayout(false);
    gotoPage(Math.round(ratio * PAGES), false);
  });

  $('#btnTrad').addEventListener('click', function(){
    var order = ['orig', 'simp', 'trad'];
    S.cs = order[(order.indexOf(S.cs) + 1) % 3];
    saveCfg(); syncControls();
    toast('字形：' + CS_LABEL[S.cs], 1200);
    if (!R.chapters.length) return;
    buildChapter();
    measureAndLayout(true);
  });

  $('#btnFull').addEventListener('click', toggleFull);

  // 字号
  function setSize(v){
    S.size = Math.min(36, Math.max(13, v));
    saveCfg(); applyVars(); syncControls();
    if (R.chapters.length) measureAndLayout(true);
  }
  $('#fsMinus').addEventListener('click', function(){ setSize(S.size - 1); });
  $('#fsPlus').addEventListener('click', function(){ setSize(S.size + 1); });
  $('#fsRange').addEventListener('input', function(e){ setSize(parseInt(e.target.value, 10)); });

  $('#lhRange').addEventListener('input', function(e){
    S.line = (parseInt(e.target.value, 10) || 190) / 100;
    saveCfg(); applyVars(); syncControls();
    if (R.chapters.length) measureAndLayout(true);
  });
  $('#mxRange').addEventListener('input', function(e){
    S.mx = parseInt(e.target.value, 10) || 26;
    saveCfg(); applyVars(); syncControls();
    if (R.chapters.length) measureAndLayout(true);
  });
  $('#myRange').addEventListener('input', function(e){
    S.my = parseInt(e.target.value, 10) || 34;
    saveCfg(); applyVars(); syncControls();
    if (R.chapters.length) measureAndLayout(true);
  });

  $('#btnToShelf').addEventListener('click', function(){
    closeAllPanels();
    openShelf();
  });

  $('#btnReset').addEventListener('click', function(){
    var img = S.bgImg;
    S = Object.assign({}, DEF, { bgImg: img });
    saveCfg(); applyVars(); applyTheme(); syncControls();
    buildFontUI(); buildColorUI(); buildBgUI();
    if (R.chapters.length){ buildChapter(); measureAndLayout(true); }
  });

  // 离开前把进度落盘，避免最后一页翻完就关掉
  window.addEventListener('pagehide', function(){ if (R.bookId) saveProgress(); });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden'){
      if (R.bookId) saveProgress();
      timerPause();
    }else if (R.bookId && $('#shelf').classList.contains('off')){
      timerStart();
    }
  });

  // 尺寸变化
  var onResize = debounce(function(){
    if (R.chapters.length) measureAndLayout(true);
  }, 160);
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function(){ setTimeout(onResize, 240); });

  // 首屏
  ensureShelves().catch(function(){}).then(function(){
    openShelf();
    return dbAll();
  }).then(function(list){
    var lastId = LS.get(LAST_KEY, null);
    if (lastId && lastId.id && list && list.length){
      for (var i = 0; i < list.length; i++){
        if (list[i].id === lastId.id){ openFromShelf(list[i]); return; }
      }
    }
  }).catch(function(){});
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
<script>
/* PWA：只在 http(s) 下注册，本地 file:// 打开时跳过 */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function(){});
  });
}
</script>
</body>
</html>
